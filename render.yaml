services:
  - type: web
    name: fastapi-app
    runtime: python
    plan: free
    ipAllowList: []

    buildCommand: |
      pip install -r requirements.txt

    startCommand: |
      alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT

    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: fastapi-db
          property: connectionString

      - key: SECRET_KEY
        generateValue: true

      - key: ALGORITHM
        value: HS256

      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "30"

databases:
  - name: fastapi-db
    plan: free